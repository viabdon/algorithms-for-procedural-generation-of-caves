[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cavegen-tcc"
version = "0.1.0"
description = "Pipeline experimental para comparação quantitativa de algoritmos de geração procedural de cavernas 3D."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Pablo Vinícius Abdon Oliveira" },
  { name = "Felipe Claudino Cruz" }
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "trimesh>=4.0",
  "pandas>=2.0",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
  "pyspark>=4.1.2",
  "matplotlib>=3.10.9",
  "plotly>=6.0",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2",
  "stable-baselines3>=2.3",
  "gymnasium>=0.29",
  "tensorboard>=2.15"
]
profiling = [
  "nvidia-ml-py>=12.0",
  "scalene>=1.5",
  "py-spy>=0.3"
]
ui = [
    "streamlit>=1.65.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
]

# Atalhos de comando: uv run poe <tarefa>. Sem nome de tarefa, lista todas.
[tool.poe.tasks]
test = { cmd = "python tests/rodar.py", help = "Roda a suite completa com relatorio (--detalhe mostra tudo)" }
test-um = { cmd = "python tests/rodar.py --detalhe", help = "Roda um modulo: poe test-um tests/test_volume.py" }
menu-ca = { cmd = "python -m cavegen.generators.cellular_automata.menu", help = "Abre o menu do CA" }
menu-rw = { cmd = "python -m cavegen.generators.random_walk.menu", help = "Abre o menu do Random Walk" }
ui = { cmd = "uv run --extra ui streamlit run src/cavegen/ui/cellular_automata/app.py", help = "Abre a bancada Streamlit do CA" }
